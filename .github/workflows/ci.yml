name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'codex/**'
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install CLI dependencies
        run: npm --prefix clawcity-cli ci

      - name: Validate agent workspace layout
        run: npm run check:agent-layout

      - name: Run app + CLI tests
        run: npm run test:all

      - name: Build application
        run: npm run build
